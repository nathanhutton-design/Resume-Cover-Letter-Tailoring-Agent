<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume & Cover Letter Tailoring Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Resume &amp; Cover Letter Tailoring Agent</h1>
    <p class="subtitle">Paste your resume and a job posting below. Get a tailored resume and cover letter back — grounded in what's already on your resume.</p>
  </header>

  <main>
    <section class="input-section">
      <div class="field">
        <label for="resume">Your Resume</label>
        <textarea id="resume" placeholder="Paste your resume text here..."></textarea>
      </div>
      <div class="field">
        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" placeholder="Paste the IT / help desk job posting here..."></textarea>
      </div>
      <button id="tailorBtn">Tailor My Application</button>
      <p id="status"></p>
    </section>

    <section class="output-section" id="outputSection" hidden>
      <div class="field">
        <label for="tailoredResume">Tailored Resume</label>
        <textarea id="tailoredResume" readonly></textarea>
      </div>
      <div class="field">
        <label for="coverLetter">Cover Letter</label>
        <textarea id="coverLetter" readonly></textarea>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
